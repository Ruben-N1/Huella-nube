<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huella energética de la nube</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #18332e;
      background: #edf2eb;
      --forest: #153d34;
      --muted: #4f665f;
      --lime: #dfefad;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; }
    main { width: min(64rem, calc(100% - 2rem)); margin: clamp(1rem, 4vw, 3rem) auto; }
    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: clamp(1.5rem, 5vw, 3.75rem);
      border-radius: 1.65rem 1.65rem .4rem .4rem;
      background: radial-gradient(ellipse at 100% 0%, #306958 0%, var(--forest) 62%);
      color: #f7faef;
    }
    .hero::after {
      content: '';
      position: absolute;
      z-index: -1;
      right: -8rem;
      top: -14rem;
      width: 31rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background: repeating-radial-gradient(circle, transparent 0 1.2rem, #e0f5ce22 1.23rem 1.3rem);
      pointer-events: none;
    }
    h1 { max-width: 13ch; margin: 0; font-size: clamp(2.4rem, 7vw, 4.75rem); letter-spacing: -.065em; line-height: 1; }
    .title-button {
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      font: inherit;
      letter-spacing: inherit;
      text-align: left;
      cursor: pointer;
    }
    .hero p { max-width: 34rem; margin: 1.25rem 0 0; color: #dfede4; line-height: 1.55; }
    .sheet { margin-top: .55rem; padding: clamp(1rem, 4vw, 2.25rem); background: #fbfcf7; border-radius: .4rem .4rem 1.65rem 1.65rem; }
    fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
    legend { padding: 0; margin-bottom: 1rem; font-size: 1.35rem; font-weight: 700; letter-spacing: -.025em; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
    .field { display: grid; grid-template-columns: minmax(0, 1fr) 5.5rem; align-items: center; gap: .75rem; padding: .85rem; border: 1px solid #d8e2d5; border-radius: .85rem; }
    .field label { font-weight: 650; }
    .unit { display: block; margin-top: .15rem; color: var(--muted); font-size: .82rem; font-weight: 400; line-height: 1.35; }
    input { min-width: 0; width: 100%; padding: .65rem .45rem; border: 1px solid #9db4a8; border-radius: .55rem; background: white; color: #18332e; font: inherit; text-align: right; }
    :focus-visible { outline: 3px solid #297d64; outline-offset: 3px; }
    .title-button:focus-visible { outline-color: var(--lime); }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1rem; margin-top: 1.25rem; }
    .submit { border: 1px solid transparent; border-radius: .65rem; background: var(--lime); color: #1b3628; padding: .8rem 1.25rem; font: inherit; font-weight: 700; cursor: pointer; }
    .submit:hover:not(:disabled) { background: #d3e99a; }
    .submit:disabled { opacity: .65; cursor: wait; }
    #status { margin: 0; color: var(--muted); font-size: .92rem; }
    #status[data-error] { color: #8b2d23; }
    .result { margin-top: 1.1rem; padding: 1rem 1.1rem; border-radius: .8rem; border: 1px solid #c6dccb; background: #edf5e9; }
    .result h2 { margin: 0 0 .45rem; font-size: 1.15rem; }
    .result p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
    @media (max-width: 42rem) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <h1><button class="title-button" id="demo" type="button" aria-label="Huella energética de la nube. Llenar con datos de ejemplo">Huella energética de la nube</button></h1>
      <p>Cada acción digital se procesa en centros de datos que consumen energía. Ingresa tus hábitos para estimar tu huella energética.</p>
    </header>

    <section class="sheet" aria-labelledby="habitos">
      <form id="footprint-form">
        <fieldset>
          <legend id="habitos">Tus hábitos digitales</legend>
          <div class="grid">
            <div class="field">
              <label for="video">Video en streaming<span class="unit">Horas al día · YouTube, Netflix, TikTok</span></label>
              <input id="video" name="video" type="number" min="0" step="any" value="0" required>
            </div>
            <div class="field">
              <label for="musica">Música en streaming<span class="unit">Horas al día</span></label>
              <input id="musica" name="musica" type="number" min="0" step="any" value="0" required>
            </div>
            <div class="field">
              <label for="redes">Redes sociales<span class="unit">Horas al día</span></label>
              <input id="redes" name="redes" type="number" min="0" step="any" value="0" required>
            </div>
            <div class="field">
              <label for="videollamadas">Videollamadas<span class="unit">Horas a la semana</span></label>
              <input id="videollamadas" name="videollamadas" type="number" min="0" step="any" value="0" required>
            </div>
            <div class="field">
              <label for="juegos">Juegos en línea<span class="unit">Horas al día</span></label>
              <input id="juegos" name="juegos" type="number" min="0" step="any" value="0" required>
            </div>
            <div class="field">
              <label for="nube">Almacenamiento en la nube<span class="unit">GB guardados · fotos y archivos</span></label>
              <input id="nube" name="nube" type="number" min="0" step="any" value="0" required>
            </div>
            <div class="field">
              <label for="ia">Consultas a chatbots de IA<span class="unit">Consultas al día</span></label>
              <input id="ia" name="ia" type="number" min="0" step="1" value="0" required>
            </div>
            <div class="field">
              <label for="correos">Correos enviados<span class="unit">Correos al día</span></label>
              <input id="correos" name="correos" type="number" min="0" step="1" value="0" required>
            </div>
          </div>
        </fieldset>
        <div class="actions">
          <button class="submit" id="calculate" type="submit">Calcular mi huella</button>
          <p id="status" role="status" aria-live="polite"></p>
        </div>
      </form>
      <section class="result" id="result" aria-labelledby="result-title" aria-live="polite" hidden>
        <h2 id="result-title">Tu huella estimada</h2>
        <p id="result-text"></p>
      </section>
    </section>
  </main>
  <script>
    // Pega aquí, entre las comillas, la URL de tu webhook de Make.
    const WEBHOOK_URL = "";

    const example = { video: 2, musica: 1, redes: 1.5, videollamadas: 3, juegos: 0.5, nube: 25, ia: 5, correos: 8 };
    const form = document.getElementById('footprint-form');
    const calculate = document.getElementById('calculate');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const resultText = document.getElementById('result-text');

    function showStatus(message, isError = false) {
      status.textContent = message;
      status.toggleAttribute('data-error', isError);
    }

    document.getElementById('demo').addEventListener('click', () => {
      if (calculate.disabled) return;
      for (const [name, value] of Object.entries(example)) {
        form.elements.namedItem(name).value = value;
      }
      result.hidden = true;
      showStatus('Datos de ejemplo cargados. Puedes editarlos o calcular tu huella.');
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (calculate.disabled || !form.reportValidity()) return;

      const data = new FormData(form);
      const body = new URLSearchParams();
      for (const name of Object.keys(example)) body.set(name, data.get(name));

      result.hidden = true;
      calculate.disabled = true;
      calculate.textContent = 'Calculando...';
      showStatus('Calculando...');

      try {
        const response = await fetch(WEBHOOK_URL, { method: 'POST', body });
        if (!response.ok) {
          showStatus(`Make devolvió un error (HTTP ${response.status}). Intenta de nuevo.`, true);
          return;
        }

        const estimate = (await response.text()).trim();
        if (!estimate || /^accepted$/i.test(estimate)) {
          showStatus('Make recibió los datos. El escenario debe devolver la estimación para mostrarla aquí.');
          return;
        }

        resultText.textContent = estimate;
        result.hidden = false;
        showStatus('');
      } catch (error) {
        showStatus('No se pudo leer la respuesta de Make. Revisa la conexión e inténtalo de nuevo.', true);
      } finally {
        calculate.disabled = false;
        calculate.textContent = 'Calcular mi huella';
      }
    });
  </script>
</body>
</html>
